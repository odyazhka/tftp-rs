[package]
name = "tftp-rs"
version = "0.1.0"
edition = "2021"
authors = ["averin"]

[[bin]]
name = "tftp-rs"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
rfd = "0.14"          # нативные диалоги выбора файла/папки
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
if-addrs = "0.13"
blake3 = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
